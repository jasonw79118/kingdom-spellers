name = "kingdom-spellers-tts"
main = "src/index.js"
compatibility_date = "2026-09-30"

# The ElevenLabs key is NOT set here — it is a secret, so it never lands in git:
#
#   npx wrangler secret put ELEVENLABS_API_KEY
#
# Paste the sk_... value when prompted. That is the whole point of this worker:
# the key stays server-side instead of being inlined into the public bundle.

[observability]
enabled = true

# Existing account-level encrypted secret; the value is never in source.
[[secrets_store_secrets]]
binding = "ELEVENLABS_API_KEY"
store_id = "43a07ab104a3460d862c9bc75350eb52"
secret_name = "Elevenlabs_API_Key"
