<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2b2440" />
    <!--
      GitHub Pages caches index.html, so a deploy can leave the browser on the
      previous build (and therefore the previous hashed asset). This nudges
      browsers to revalidate. Hashed assets under /assets stay cacheable, since
      their names change whenever the code does.
    -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta
      name="description"
      content="Kingdom Spellers — restore the kingdom, one spelling word at a time."
    />
    <title>Kingdom Spellers</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
